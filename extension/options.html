<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>MU Portal Rewrite の設定</title>
<!-- 色・形は src/ui/tokens.css と Starwind のラジオ(sm・primary)に揃える -->
<style>
  :root { --primary: #541b86; --fg: #1f1a24; --muted: #f4f2f6; --muted-fg: #6b6474; --border: #d9d4df; --input: #c9c3d1 }
  * { box-sizing: border-box }
  body { margin: 0; width: 300px; background: #f3f2f5; color: var(--fg); font: 14px "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif }
  .bar { display: flex; align-items: center; height: 44px; padding: 0 14px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 700; letter-spacing: .06em }
  section { margin: 12px; border: 1px solid var(--border); border-radius: 4px; background: #fff }
  h2 { margin: 0; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--muted); font-size: 14px; font-weight: 600 }
  fieldset { display: flex; flex-wrap: wrap; gap: 12px; margin: 0; padding: 14px; border: 0 }
  label { display: flex; align-items: center; gap: 6px; cursor: pointer }
  input[type=radio] { appearance: none; display: grid; place-content: center; width: 16px; height: 16px; margin: 0; border: 1px solid var(--input); border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .05); cursor: pointer; transition: border-color .15s, box-shadow .15s }
  input[type=radio]::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); opacity: 0; transition: opacity .15s }
  input[type=radio]:checked { border-color: var(--primary) }
  input[type=radio]:checked::before { opacity: 1 }
  input[type=radio]:focus-visible { outline: none; box-shadow: 0 0 0 3px rgb(84 27 134 / .5) }
  p { margin: 0; padding: 0 14px 12px; color: var(--muted-fg); font-size: 12px }
</style>
</head>
<body>
<div class="bar">MU Rewrite</div>
<section>
  <h2>表示の大きさ</h2>
  <fieldset id="zoom" aria-label="表示の大きさ">
    <label><input type="radio" name="zoom" value="90"> 小</label>
    <label><input type="radio" name="zoom" value="100"> 標準</label>
    <label><input type="radio" name="zoom" value="112"> 大</label>
    <label><input type="radio" name="zoom" value="125"> 特大</label>
  </fieldset>
  <p>MUSCAT・ポータル・LMS に効きます。開いている画面もすぐ変わります。</p>
</section>
<section>
  <h2>バージョン</h2>
  <p style="padding-top:12px"><span id="version"></span><span id="update"></span></p>
</section>
<section>
  <h2>ご意見・不具合報告</h2>
  <p style="padding-top:12px"><a href="https://forms.gle/TVVn6zRAQDT8tqUX8" target="_blank">フォームを開く</a>。報告するときは上のバージョンも書いてください</p>
</section>
<script src="options.js"></script>
</body>
</html>
